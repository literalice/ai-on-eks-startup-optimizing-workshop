################################################################################
# Arm A -- baseline
#
# Bottlerocket as shipped: container images live on the EBS data volume
# (/dev/xvdb) and are pulled sequentially by containerd's default snapshotter.
# This is the number every other arm is measured against.
#
# The data volume is deliberately given the same 100Gi / gp3 16000 IOPS /
# 1000 MiB/s as arm C's root, so the difference between A and C is the pull
# mechanism and the storage medium, not the volume's provisioned performance.
################################################################################
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: arm-a-baseline
spec:
  amiSelectorTerms:
    # Resolves the aws-k8s-<version>-nvidia variant automatically for GPU
    # instance types, so the NVIDIA driver, container toolkit and Kubernetes
    # device plugin are all already on the node. No device plugin DaemonSet.
    - alias: bottlerocket@latest
  role: "@KARPENTER_NODE_IAM_ROLE_NAME@"
  blockDeviceMappings:
    # Bottlerocket control volume
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 4Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
    # Data volume: container images and logs
    - deviceName: /dev/xvdb
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        throughput: 1000
        iops: 16000
        encrypted: true
        deleteOnTermination: true
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "@CLUSTER_NAME@"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "@CLUSTER_NAME@"
  tags:
    workshop-arm: arm-a-baseline
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: arm-a-baseline
spec:
  # Never consolidate mid-measurement. reset.sh removes nodes between runs.
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30m
  limits:
    nvidia.com/gpu: "4"
  template:
    metadata:
      labels:
        workshop-arm: arm-a-baseline
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: arm-a-baseline
      # Taint so nothing but the arm's own pod can land here
      taints:
        - key: nvidia.com/gpu
          effect: NoSchedule
      expireAfter: 4h
      requirements:
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["@GPU_INSTANCE_TYPE@"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
