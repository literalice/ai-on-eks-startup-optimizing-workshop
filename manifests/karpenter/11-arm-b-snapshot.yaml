################################################################################
# Arm B -- images pre-baked into an EBS snapshot
#
# Identical to arm A except the data volume is restored from a snapshot that
# already contains the image layers, so containerd finds them locally and the
# pull is a no-op.
#
# Note what is NOT set here: instanceStorePolicy. This is the fork in the road
# the workshop is about. Arm B's images have to be on the volume restored from
# the snapshot; the moment you move container storage to local NVMe (arm C) the
# snapshot is bypassed. You get one or the other, not both.
#
# The volume is 100Gi to match arm A, and must be >= the snapshot size.
# @SNAPSHOT_ID@ is substituted by bin/prep.sh from results/snapshot-id.txt.
################################################################################
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: arm-b-snapshot
spec:
  amiSelectorTerms:
    - alias: bottlerocket@latest
  role: "@KARPENTER_NODE_IAM_ROLE_NAME@"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 4Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
    - deviceName: /dev/xvdb
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        throughput: 1000
        iops: 16000
        snapshotID: "@SNAPSHOT_ID@"
        deleteOnTermination: true
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "@CLUSTER_NAME@"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "@CLUSTER_NAME@"
  tags:
    workshop-arm: arm-b-snapshot
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: arm-b-snapshot
spec:
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30m
  limits:
    nvidia.com/gpu: "4"
  template:
    metadata:
      labels:
        workshop-arm: arm-b-snapshot
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: arm-b-snapshot
      taints:
        - key: nvidia.com/gpu
          effect: NoSchedule
      expireAfter: 4h
      requirements:
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["@GPU_INSTANCE_TYPE@"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
